  <style>
    .name { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; opacity: 0; animation: rise 1s ease-out .2s forwards; }
    .sub  { font: 400 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; opacity: 0; animation: rise 1s ease-out .7s forwards; }
    .prompt { font: 700 26px 'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; fill: #7ee7c7; opacity: 0; animation: rise .8s ease-out 1s forwards; }
    .typed { font: 500 26px 'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; fill: #7ee7c7; }
    .cursor { fill: #7ee7c7; }
    .edge { stroke: #ffffff; stroke-opacity: .10; stroke-width: 1.2; }
    .sig { stroke: #7ee7c7; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 10 400; stroke-dashoffset: 410; animation: flow 4s linear infinite; }
    .node { fill: #0d1b3e; stroke: #7ee7c7; stroke-width: 2; animation: pulse 3s ease-in-out infinite; }
    .dot { fill: #ffffff; opacity: .05; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flow { 0% { stroke-dashoffset: 410; } 60%,100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { fill: #0d1b3e; } 50% { fill: #7ee7c7; } }
  </style>
